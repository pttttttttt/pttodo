<link rel="manifest" href="manifest.json">
<style>
  :root{
    --ink:#2b2a26;
    --ink-soft:#6b675e;
    --paper:#f6f3ec;
    --paper-line:#e4ded1;
    --rule:#d8d1c0;
    --accent:#3a6b5e;          /* 墨绿 */
    --accent-soft:#e7efe9;
    --rest-short:#eceee6;      /* 短休息：低调冷灰绿 */
    --rest-short-t:#8f9b86;
    --meal:#f4e4cf;            /* 大块用餐休息：暖橙 */
    --meal-t:#b07d3f;
    --shadow:0 1px 2px rgba(43,42,38,.06),0 8px 24px rgba(43,42,38,.05);
    --radius:10px;
  }
  [data-theme="dark"]{
    --ink:#e8e4da;
    --ink-soft:#9a948a;
    --paper:#1e1d1a;
    --paper-line:#34322d;
    --rule:#403d37;
    --accent:#6ba793;          /* 暗色下提亮的墨绿 */
    --accent-soft:#243530;
    --rest-short:#26251f;
    --rest-short-t:#7d8a74;
    --meal:#3a3024;            /* 暗色用餐块 */
    --meal-t:#c9a06a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  [data-theme="dark"] .grid-wrap,[data-theme="dark"] .m-row,[data-theme="dark"] .day-tab,[data-theme="dark"] .btn{background:#26251f;}
  [data-theme="dark"] .head,[data-theme="dark"] .timecell,[data-theme="dark"] .m-time,[data-theme="dark"] .head.corner{background:#2a2822;}
  [data-theme="dark"] .plan textarea,[data-theme="dark"] .m-plan textarea{color:var(--ink);}
  [data-theme="dark"] .col-today .plan textarea{background:#2c2b23;}
  [data-theme="dark"] .modal,[data-theme="dark"] .modal-head,[data-theme="dark"] .modal-foot,[data-theme="dark"] .picker{background:#26251f;}
  [data-theme="dark"] .tpl,[data-theme="dark"] .slot-item,[data-theme="dark"] .add-slot,[data-theme="dark"] input[type=time],[data-theme="dark"] .slot-time{background:#2a2822;color:var(--ink);}
  [data-theme="dark"] .plan.rest-short{background:repeating-linear-gradient(45deg,#242320,#242320 6px,#2b2a24 6px,#2b2a24 12px);}
  [data-theme="dark"] .plan.meal{background:repeating-linear-gradient(45deg,#302819,#302819 6px,#39301f 6px,#39301f 12px);}
  [data-theme="dark"] .m-plan.rest-short{background:repeating-linear-gradient(45deg,#242320,#242320 6px,#2b2a24 6px,#2b2a24 12px);}
  [data-theme="dark"] .m-plan.meal{background:repeating-linear-gradient(45deg,#302819,#302819 6px,#39301f 6px,#39301f 12px);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--paper);min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea{font-family:inherit;}

  header{
    position:sticky;top:0;z-index:40;background:rgba(246,243,236,.92);
    backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--paper-line);
  }
  .bar{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;}
  .brand h1{font-size:19px;font-weight:700;letter-spacing:.02em;margin:0;}
  .brand .sub{font-size:12px;color:var(--ink-soft);}
  .week-nav{display:flex;align-items:center;gap:6px;}
  .week-label{font-size:13px;color:var(--ink-soft);min-width:150px;text-align:center;}
  .btn{font-size:13px;padding:7px 12px;border-radius:8px;background:#fff;border:1px solid var(--rule);color:var(--ink);transition:.15s;white-space:nowrap;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{filter:brightness(1.08);color:#fff;}
  .btn.ghost{background:transparent;border-color:transparent;padding:7px 8px;}
  .btn.icon{padding:7px 9px;font-size:15px;line-height:1;}

  main{max-width:1280px;margin:0 auto;padding:16px;}
  .grid-wrap{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}

  /* 桌面网格：用 CSS 变量控制每行高度，休息行更矮 */
  .grid{display:grid;grid-template-columns:82px repeat(7,minmax(0,1fr));}
  .cell{border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);position:relative;}
  .grid > .cell:nth-child(8n){border-right:none;}

  .head{background:var(--paper);padding:10px 6px;text-align:center;font-weight:600;font-size:13px;}
  .head .dow{font-size:13px;}
  .head .date{font-size:11px;color:var(--ink-soft);font-weight:400;margin-top:2px;}
  .head.today{background:var(--accent-soft);}
  .head.today .dow{color:var(--accent);}

  /* 时间列：可点击，滚轮编辑 */
  .timecell{background:var(--paper);padding:6px 4px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;cursor:pointer;transition:.12s;}
  .timecell:hover{background:#efeadd;box-shadow:inset 0 0 0 1.5px var(--accent);}
  .timecell .t{font-size:12px;font-weight:600;letter-spacing:.02em;}
  .timecell .t2{font-size:11px;color:var(--ink-soft);}
  .timecell.short{background:var(--rest-short);}
  .timecell.short .t{color:var(--rest-short-t);font-size:11px;}
  .timecell.short .t2{color:var(--rest-short-t);opacity:.8;}
  .timecell.meal{background:var(--meal);}
  .timecell.meal .t{color:var(--meal-t);font-size:11px;}
  .timecell.meal .t2{color:var(--meal-t);opacity:.85;}
  .timecell .tag{font-size:10px;margin-top:2px;padding:0 5px;border-radius:8px;line-height:15px;}
  .timecell.meal .tag{background:rgba(176,125,63,.18);color:var(--meal-t);}
  .timecell.short .tag{background:rgba(143,155,134,.18);color:var(--rest-short-t);}

  .plan textarea{width:100%;border:none;outline:none;resize:none;background:transparent;padding:7px 8px;font-size:13px;line-height:1.45;color:var(--ink);display:block;overflow:hidden;}
  .plan textarea::placeholder{color:#c8c2b3;}
  .plan textarea:focus{background:var(--accent-soft);}
  .col-today .plan textarea{background:#faf8f0;}
  .col-today .plan textarea:focus{background:var(--accent-soft);}

  /* 休息行的计划格：短休息斜纹冷灰，用餐斜纹暖橙 */
  .plan.rest-short{background:repeating-linear-gradient(45deg,#f2f4ee,#f2f4ee 6px,#e9ece3 6px,#e9ece3 12px);}
  .plan.meal{background:repeating-linear-gradient(45deg,#faf1e2,#faf1e2 6px,#f3e5cf 6px,#f3e5cf 12px);}
  .plan.rest textarea{font-size:12px;color:var(--ink-soft);}
  .plan.rest textarea::placeholder{color:transparent;}
  .plan.rest textarea:focus::placeholder{color:#c3bca9;}

  .empty{padding:48px 20px;text-align:center;color:var(--ink-soft);}
  .empty h3{margin:0 0 8px;color:var(--ink);font-size:16px;}
  .empty p{margin:0 0 18px;font-size:13px;}

  /* 手机 */
  .mobile-view{display:none;}
  .day-tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;}
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{flex:0 0 auto;padding:7px 12px;border-radius:20px;background:#fff;border:1px solid var(--rule);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;}
  .day-tab .d{font-size:10px;color:var(--ink-soft);}
  .day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .day-tab.active .d{color:rgba(255,255,255,.8);}
  .day-tab.today{border-color:var(--accent);}

  .m-row{display:flex;background:#fff;border-bottom:1px solid var(--paper-line);}
  .m-time{flex:0 0 76px;background:var(--paper);padding:8px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1px;border-right:1px solid var(--paper-line);cursor:pointer;}
  .m-time:active{background:#efeadd;}
  .m-time .t{font-size:12px;font-weight:600;}
  .m-time .t2{font-size:11px;color:var(--ink-soft);}
  .m-time.short{background:var(--rest-short);}
  .m-time.short .t,.m-time.short .t2{color:var(--rest-short-t);}
  .m-time.short .t{font-size:11px;}
  .m-time.meal{background:var(--meal);}
  .m-time.meal .t,.m-time.meal .t2{color:var(--meal-t);}
  .m-time.meal .t{font-size:11px;}
  .m-time .tag{font-size:10px;margin-top:1px;}
  .m-plan{flex:1;}
  .m-plan textarea{width:100%;border:none;outline:none;resize:none;background:transparent;padding:9px 10px;font-size:14px;line-height:1.45;}
  .m-plan textarea:focus{background:var(--accent-soft);}
  .m-plan.rest-short{background:repeating-linear-gradient(45deg,#f2f4ee,#f2f4ee 6px,#e9ece3 6px,#e9ece3 12px);}
  .m-plan.meal{background:repeating-linear-gradient(45deg,#faf1e2,#faf1e2 6px,#f3e5cf 6px,#f3e5cf 12px);}
  .m-plan.rest textarea{font-size:12px;color:var(--ink-soft);}

  /* 弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(43,42,38,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:16px;}
  .modal-mask.open{display:flex;}
  .modal{background:var(--paper);border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--paper-line);position:sticky;top:0;background:var(--paper);z-index:2;}
  .modal-head h2{margin:0;font-size:16px;}
  .modal-body{padding:16px 18px;}
  .modal-foot{padding:14px 18px;border-top:1px solid var(--paper-line);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--paper);}

  .slot-hint{font-size:12px;color:var(--ink-soft);margin:0 0 12px;line-height:1.6;}
  .tpl-list{display:flex;flex-direction:column;gap:8px;}
  .tpl{text-align:left;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 14px;transition:.15s;}
  .tpl:hover{border-color:var(--accent);box-shadow:var(--shadow);}
  .tpl .name{font-size:14px;font-weight:600;margin-bottom:3px;}
  .tpl .desc{font-size:12px;color:var(--ink-soft);line-height:1.5;}
  .section-title{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}

  /* 时间段列表（弹窗内，行内快捷编辑） */
  .slot-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .slot-item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;}
  .slot-item.short{background:var(--rest-short);border-color:#dbe0d3;}
  .slot-item.meal{background:var(--meal);border-color:#e6d3b8;}
  .slot-time{font-size:14px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;background:none;border:none;padding:2px 4px;border-radius:6px;color:var(--ink);cursor:pointer;}
  .slot-time:hover{background:var(--accent-soft);color:var(--accent);}
  .slot-item .dash{color:var(--ink-soft);}
  .slot-item .kind{font-size:11px;margin-left:2px;padding:2px 7px;border-radius:10px;}
  .slot-item.meal .kind{background:rgba(176,125,63,.18);color:var(--meal-t);}
  .slot-item.short .kind{background:rgba(143,155,134,.2);color:var(--rest-short-t);}
  .slot-item label{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;cursor:pointer;margin-left:auto;}
  .slot-item .del{color:#b5453a;font-size:16px;padding:2px 6px;border-radius:6px;}
  .slot-item .del:hover{background:#f6e3e0;}
  .add-slot{width:100%;padding:9px;border:1px dashed var(--rule);border-radius:8px;background:#fff;color:var(--accent);font-size:13px;}
  .add-slot:hover{border-color:var(--accent);background:var(--accent-soft);}

  /* ===== 滚轮时间选择器 ===== */
  .picker-mask{position:fixed;inset:0;background:rgba(43,42,38,.45);display:none;align-items:flex-end;justify-content:center;z-index:80;}
  .picker-mask.open{display:flex;}
  @media(min-width:560px){.picker-mask.open{align-items:center;}}
  .picker{background:var(--paper);width:100%;max-width:420px;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:slideup .22s ease;}
  @media(min-width:560px){.picker{border-radius:18px;}}
  @keyframes slideup{from{transform:translateY(30px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .picker-head{padding:14px 18px 4px;text-align:center;}
  .picker-head .title{font-size:15px;font-weight:600;}
  .picker-head .whichlabel{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .picker-switch{display:flex;gap:6px;justify-content:center;padding:10px 18px 4px;}
  .picker-switch button{flex:1;max-width:130px;padding:8px;border-radius:9px;border:1px solid var(--rule);background:#fff;font-size:13px;color:var(--ink-soft);}
  .picker-switch button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .picker-kind{display:flex;gap:6px;justify-content:center;padding:2px 18px 4px;}
  .picker-kind button{flex:1;max-width:130px;padding:8px;border-radius:9px;border:1px solid var(--rule);background:#fff;font-size:13px;color:var(--ink-soft);}
  .picker-kind button[data-kind="short"].on{background:var(--rest-short-t);border-color:var(--rest-short-t);color:#fff;font-weight:600;}
  .picker-kind button[data-kind="meal"].on{background:var(--meal-t);border-color:var(--meal-t);color:#fff;font-weight:600;}
  .wheels{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 18px 4px;position:relative;}
  .wheel{
    height:180px;width:78px;overflow-y:scroll;scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;
    mask-image:linear-gradient(to bottom,transparent,#000 32%,#000 68%,transparent);
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 32%,#000 68%,transparent);
  }
  .wheel::-webkit-scrollbar{display:none;}
  .wheel .item{height:36px;line-height:36px;text-align:center;scroll-snap-align:center;font-size:22px;color:var(--ink-soft);font-variant-numeric:tabular-nums;transition:color .1s,font-weight .1s;}
  .wheel .item.sel{color:var(--accent);font-weight:700;font-size:24px;}
  .wheel .pad{height:72px;}
  .wheel-colon{font-size:24px;font-weight:700;color:var(--ink);padding-bottom:2px;}
  .picker-center{position:absolute;left:18px;right:18px;top:50%;height:36px;transform:translateY(-50%);border-top:1.5px solid var(--rule);border-bottom:1.5px solid var(--rule);pointer-events:none;border-radius:4px;background:rgba(58,107,94,.04);}
  .picker-preview{text-align:center;font-size:13px;color:var(--ink-soft);padding:2px 0 2px;}
  .picker-preview b{color:var(--accent);font-variant-numeric:tabular-nums;}
  .picker-foot{display:flex;gap:8px;padding:12px 18px 18px;}
  .picker-foot .btn{flex:1;justify-content:center;text-align:center;padding:11px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:90;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .file-input{display:none;}

  @media (max-width:820px){
    .desktop-view{display:none;}
    .mobile-view{display:block;}
    .bar{padding:10px 12px;gap:8px;}
    .brand h1{font-size:17px;}
    .week-label{min-width:auto;font-size:12px;}
    main{padding:12px;}
    .btn{padding:6px 10px;font-size:12px;}
  }

  /* ===== 完成勾 & 多条 ===== */
  .plan{position:relative;}
  .items{display:flex;flex-direction:column;width:100%;min-height:100%;padding:3px 4px 3px 0;box-sizing:border-box;}
  .item-row{display:flex;align-items:flex-start;gap:0;}
  .done-btn{
    flex:0 0 auto;width:17px;height:17px;margin:4px 4px 0 6px;border-radius:50%;
    border:1.5px solid var(--rule);background:transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;
    transition:.12s;padding:0;line-height:1;
  }
  .done-btn:hover{border-color:var(--accent);}
  .done-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .item-row textarea{
    flex:1;border:none;outline:none;resize:none;background:transparent;
    padding:3px 4px 3px 2px;font-size:13px;line-height:1.4;color:var(--ink);
    min-height:24px;overflow:hidden;
  }
  .item-row textarea::placeholder{color:#c8c2b3;}
  .item-row.done textarea{text-decoration:line-through;color:var(--ink-soft);opacity:.6;}
  .item-row textarea:focus{background:var(--accent-soft);border-radius:4px;}
  .col-today .item-row textarea{background:transparent;}
  .add-line{
    font-size:12px;color:var(--ink-soft);cursor:text;padding:2px 4px 2px 27px;opacity:.5;
  }
  .add-line:hover{opacity:1;color:var(--accent);}
  /* 拖放高亮 */
  .plan.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)!important;}

  .m-plan .items{padding:5px 6px 5px 0;}
  .m-plan .item-row textarea{font-size:14px;min-height:26px;padding:5px 6px 5px 2px;}
  .m-plan .done-btn{margin:6px 4px 0 8px;width:19px;height:19px;}
  .m-plan .add-line{padding:4px 6px 6px 31px;font-size:13px;}
  .m-plan.drop-hover{outline:2px dashed var(--accent);outline-offset:-2px;}
  /* 拖拽跟随浮层 */
  .drag-ghost{
    position:fixed;z-index:100;pointer-events:none;
    transform:translate(-50%,-140%);
    background:var(--accent);color:#fff;padding:7px 12px;border-radius:8px;
    font-size:13px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 6px 20px rgba(0,0,0,.3);
  }
  .task{touch-action:none;} /* 允许 pointer 拖拽不被滚动打断 */

  /* ===== 清单抽屉 ===== */
  .inbox-mask{position:fixed;inset:0;background:rgba(43,42,38,.4);display:none;z-index:55;}
  .inbox-mask.open{display:block;}
  .inbox{
    position:fixed;top:0;right:0;height:100%;width:340px;max-width:88vw;
    background:var(--paper);box-shadow:-8px 0 40px rgba(0,0,0,.2);z-index:56;
    transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;
  }
  .inbox.open{transform:translateX(0);}
  .inbox-head{padding:16px 18px;border-bottom:1px solid var(--paper-line);display:flex;align-items:center;justify-content:space-between;}
  .inbox-head h2{margin:0;font-size:16px;}
  .inbox-head .hint{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .inbox-body{flex:1;overflow-y:auto;padding:12px 14px;}
  .cat-block{margin-bottom:16px;}
  .cat-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .cat-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
  .cat-title .cat-del{margin-left:auto;color:#b5453a;font-size:13px;cursor:pointer;opacity:.6;}
  .cat-title .cat-del:hover{opacity:1;}
  .task{
    display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--rule);
    border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;cursor:grab;transition:.12s;
  }
  [data-theme="dark"] .task{background:#2a2822;}
  .task:active{cursor:grabbing;}
  .task.dragging{opacity:.4;}
  .task .grip{color:var(--ink-soft);font-size:14px;flex:0 0 auto;}
  .task .txt{flex:1;word-break:break-word;}
  .task .task-del{color:#b5453a;opacity:.5;cursor:pointer;flex:0 0 auto;padding:0 2px;}
  .task .task-del:hover{opacity:1;}
  .add-task{display:flex;gap:6px;margin-top:4px;}
  .add-task input{flex:1;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:var(--ink);}
  [data-theme="dark"] .add-task input{background:#2a2822;}
  .add-task button{padding:8px 12px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;}
  .inbox-foot{padding:12px 14px;border-top:1px solid var(--paper-line);}
  .add-cat{width:100%;padding:8px;border:1px dashed var(--rule);border-radius:8px;background:transparent;color:var(--accent);font-size:13px;}
  .add-cat:hover{border-color:var(--accent);background:var(--accent-soft);}
  .inbox-empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:20px 0;}

  /* 手机端清单占满 */
  @media (max-width:560px){.inbox{width:100%;max-width:100%;}}

  /* ===== 手机整周概览 ===== */
  .m-modeswitch{display:flex;gap:6px;padding:0 0 8px;}
  .m-modeswitch button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--rule);background:#fff;font-size:13px;color:var(--ink-soft);}
  [data-theme="dark"] .m-modeswitch button{background:#26251f;}
  .m-modeswitch button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .week-overview{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--paper-line);border-radius:10px;background:#fff;}
  [data-theme="dark"] .week-overview{background:#26251f;}
  .ov-grid{display:grid;grid-template-columns:52px repeat(7,minmax(64px,1fr));min-width:560px;}
  .ov-cell{border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line);padding:3px 4px;font-size:10px;line-height:1.3;overflow:hidden;}
  .ov-grid>.ov-cell:nth-child(8n){border-right:none;}
  .ov-head{background:var(--paper);text-align:center;font-weight:600;position:sticky;top:0;}
  .ov-head.today{background:var(--accent-soft);color:var(--accent);}
  .ov-time{background:var(--paper);text-align:center;font-size:9px;color:var(--ink-soft);display:flex;flex-direction:column;justify-content:center;}
  .ov-time.short{background:var(--rest-short);}
  .ov-time.meal{background:var(--meal);color:var(--meal-t);}
  .ov-plan{min-height:26px;color:var(--ink);}
  .ov-plan.done{text-decoration:line-through;color:var(--ink-soft);opacity:.6;}
  .ov-plan.rest-short{background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(143,155,134,.08) 5px,rgba(143,155,134,.08) 10px);}
  .ov-plan.meal{background:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(176,125,63,.1) 5px,rgba(176,125,63,.1) 10px);}
  .ov-hint{font-size:11px;color:var(--ink-soft);text-align:center;padding:8px 0 0;}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <h1>周计划表</h1>
      <span class="sub">每一格，都是认真安排的时间</span>
    </div>
    <div class="week-nav">
      <button class="btn icon" id="prevWeek" title="上一周">‹</button>
      <span class="week-label" id="weekLabel"></span>
      <button class="btn icon" id="nextWeek" title="下一周">›</button>
      <button class="btn ghost" id="thisWeek">回到本周</button>
    </div>
    <button class="btn" id="inboxBtn">📋 清单</button>
    <button class="btn" id="editSlots">⚙ 时间段</button>
    <button class="btn" id="exportBtn">↓ 导出</button>
    <button class="btn" id="importBtn">↑ 导入</button>
    <button class="btn icon" id="themeBtn" title="深色/浅色">🌙</button>
    <input type="file" id="fileInput" class="file-input" accept="application/json">
  </div>
</header>

<main>
  <div class="grid-wrap" id="board"></div>
</main>

<!-- 时间段设置弹窗 -->
<div class="modal-mask" id="slotModal">
  <div class="modal">
    <div class="modal-head">
      <h2>设置时间段</h2>
      <button class="btn ghost icon" data-close-slot>✕</button>
    </div>
    <div class="modal-body">
      <p class="slot-hint">
        点时间数字，用滚轮调整开始 / 结束（会自动衔接前后时间）。<br>
        勾「休息」后会出现「用餐」选项：勾上就是用餐大块（暖橙），不勾就是普通小憩（灰绿）。
      </p>
      <div class="section-title">一键套用模板</div>
      <div class="tpl-list" id="tplList"></div>
      <div class="section-title">当前时间段</div>
      <div class="slot-list" id="slotList"></div>
      <button class="add-slot" id="addSlot">＋ 添加一个时间段</button>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close-slot>取消</button>
      <button class="btn primary" id="saveSlots">保存</button>
    </div>
  </div>
</div>

<!-- 滚轮时间选择器 -->
<div class="picker-mask" id="pickerMask">
  <div class="picker">
    <div class="picker-head">
      <div class="title" id="pickerTitle">调整时间</div>
      <div class="whichlabel" id="pickerWhich"></div>
    </div>
    <div class="picker-switch" id="pickerSwitch">
      <button data-edge="start">开始</button>
      <button data-edge="end">结束</button>
    </div>
    <div class="picker-kind" id="pickerKind">
      <button data-kind="short">休息</button>
      <button data-kind="meal">用餐</button>
    </div>
    <div class="wheels">
      <div class="wheel" id="wheelH"></div>
      <div class="wheel-colon">:</div>
      <div class="wheel" id="wheelM"></div>
      <div class="picker-center"></div>
    </div>
    <div class="picker-preview" id="pickerPreview"></div>
    <div class="picker-foot">
      <button class="btn" id="pickerCancel">取消</button>
      <button class="btn primary" id="pickerDone">完成</button>
    </div>
  </div>
</div>

<!-- 清单收集区抽屉 -->
<div class="inbox-mask" id="inboxMask"></div>
<aside class="inbox" id="inbox">
  <div class="inbox-head">
    <div>
      <h2>清单</h2>
      <div class="hint">先把要做的事写在这里，再拖进计划表</div>
    </div>
    <button class="btn ghost icon" id="closeInbox">✕</button>
  </div>
  <div class="inbox-body" id="inboxBody"></div>
  <div class="inbox-foot">
    <button class="add-cat" id="addCat">＋ 新建模块</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY='weekly-planner-v1';
const DOW=['周一','周二','周三','周四','周五','周六','周日'];

/* 默认时间段 */
const DEFAULT_SLOTS=[
  {start:'08:30',end:'09:30',rest:false},
  {start:'09:30',end:'09:50',rest:true},
  {start:'09:50',end:'10:50',rest:false},
  {start:'10:50',end:'11:10',rest:true},
  {start:'11:10',end:'12:10',rest:false},
  {start:'12:10',end:'13:30',rest:true,meal:true},   // 午饭 -> 用餐
  {start:'13:30',end:'14:30',rest:false},
  {start:'14:30',end:'14:50',rest:true},
  {start:'14:50',end:'15:50',rest:false},
  {start:'15:50',end:'16:10',rest:true},
  {start:'16:10',end:'17:10',rest:false},
  {start:'17:10',end:'19:00',rest:true,meal:true},   // 晚饭 -> 用餐
  {start:'19:00',end:'20:00',rest:false},
  {start:'20:00',end:'20:15',rest:true},
  {start:'20:15',end:'21:15',rest:false},
];

const TEMPLATES=[
  {name:'专注学习日',desc:'50分钟专注 + 10分钟休息，含午饭晚饭大块，适合备考/写论文/深度工作',
   build:()=>buildPomodoro('08:30','21:30',50,10,[['12:00','13:30'],['17:30','19:00']])},
  {name:'标准工作日',desc:'9:00 起，一小时块 + 短休息，含午休，到 18:00',
   build:()=>[s('09:00','10:00'),s('10:00','10:15',true),s('10:15','11:15'),s('11:15','11:30',true),s('11:30','12:30'),s('12:30','13:30',true,true),s('13:30','14:30'),s('14:30','14:45',true),s('14:45','15:45'),s('15:45','16:00',true),s('16:00','17:00'),s('17:00','18:00')]},
  {name:'早鸟作息',desc:'6:30 起床，上午高强度，下午轻松，晚上早收工',
   build:()=>[s('06:30','07:00'),s('07:00','08:00'),s('08:00','08:15',true),s('08:15','09:15'),s('09:15','09:30',true),s('09:30','10:30'),s('10:30','10:45',true),s('10:45','11:45'),s('11:45','13:00',true,true),s('13:00','14:00'),s('14:00','14:15',true),s('14:15','15:15'),s('15:15','17:00'),s('19:00','20:30')]},
  {name:'半天两大块',desc:'上午一大段、下午一大段的极简版，适合不喜欢被切太碎的人',
   build:()=>[s('09:00','12:00'),s('12:00','14:00',true,true),s('14:00','17:00'),s('17:00','19:00',true,true),s('19:00','21:00')]},
];

function buildPomodoro(dayStart,dayEnd,focus,brk,excludes){
  const out=[];let cur=toMin(dayStart);const end=toMin(dayEnd);
  const exc=excludes.map(e=>[toMin(e[0]),toMin(e[1])]).sort((a,b)=>a[0]-b[0]);
  while(cur<end){
    const hit=exc.find(e=>cur>=e[0]&&cur<e[1]);
    if(hit){out.push(s(toHM(cur),toHM(hit[1]),true,true));cur=hit[1];continue;}
    const nextExc=exc.find(e=>e[0]>cur);
    const cap=nextExc?Math.min(end,nextExc[0]):end;
    let f=Math.min(cur+focus,cap);if(f>cur)out.push(s(toHM(cur),toHM(f)));cur=f;
    if(cur>=cap)continue;
    let b=Math.min(cur+brk,cap);if(b>cur)out.push(s(toHM(cur),toHM(b),true));cur=b;
  }
  return out;
}
function s(start,end,rest=false,meal=false){return{start,end,rest,meal};}
function toMin(hm){const[h,m]=hm.split(':').map(Number);return h*60+m;}
function toHM(min){min=((min%1440)+1440)%1440;const h=Math.floor(min/60),m=min%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function durMin(sl){let d=toMin(sl.end)-toMin(sl.start);if(d<0)d+=1440;return d;}
function slotKind(sl){ if(!sl.rest) return 'work'; return sl.meal?'meal':'short'; }

/* 状态 */
const DEFAULT_CATEGORIES=['工作','学习','生活'];
let state=load();
let currentMonday=mondayOf(new Date());
let activeDay=clampToday();

function load(){
  let d=null;
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const p=JSON.parse(raw);if(p.slots&&p.plans)d=p;}}catch(e){}
  if(!d) d={slots:DEFAULT_SLOTS.map(x=>({...x})),plans:{}};
  // 补齐新字段（老数据没有这些）
  if(!Array.isArray(d.inbox)) d.inbox=[];
  if(!Array.isArray(d.categories)) d.categories=DEFAULT_CATEGORIES.slice();
  if(!d.theme) d.theme='light';
  return d;
}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}

function mondayOf(date){const d=new Date(date);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);d.setHours(0,0,0,0);return d;}
function fmt(date){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return`${y}-${m}-${d}`;}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d;}
function weekKey(){return fmt(currentMonday);}
function isToday(date){return fmt(date)===fmt(new Date());}
function clampToday(){return(new Date().getDay()+6)%7;}

/* 计划格的值统一为 {t:文本, d:完成}。兼容旧的纯字符串。 */
function normPlan(v){
  if(v==null) return null;
  if(typeof v==='string') return v.trim()===''?null:{t:v,d:false};
  return v;
}
/* 计划格统一为多条：返回 [{t,d}, ...]。兼容旧的字符串 / 单对象 / 带\n的多行文本。 */
function getItems(di,si){
  const wk=state.plans[weekKey()];
  if(!wk) return [];
  let v=(wk[di]&&wk[di][si]);
  if(v==null) return [];
  // 已是新格式：{items:[...]}
  if(v.items && Array.isArray(v.items)) return v.items;
  // 旧单对象 {t,d}：若 t 里含换行，拆成多条（继承同一完成状态给第一条，其余未完成）
  if(typeof v==='object' && 't' in v){
    const lines=String(v.t).split('\n').filter(x=>x.trim()!=='');
    if(lines.length<=1) return v.t.trim()===''?[]:[{t:v.t,d:!!v.d}];
    return lines.map((t,i)=>({t, d:i===0?!!v.d:false}));
  }
  // 旧纯字符串
  if(typeof v==='string'){
    const lines=v.split('\n').filter(x=>x.trim()!=='');
    return lines.map(t=>({t,d:false}));
  }
  return [];
}
function setItems(di,si,items){
  const wk=weekKey();
  if(!state.plans[wk])state.plans[wk]={};
  if(!state.plans[wk][di])state.plans[wk][di]={};
  const clean=items.filter(it=>it && it.t!=null); // 保留空字符串条目(正在输入)，但过滤null
  if(clean.length===0){
    delete state.plans[wk][di][si];
  }else{
    state.plans[wk][di][si]={items:clean};
  }
  save();
}
// 兼容旧调用：getPlan 返回合并文本；isDone 返回"是否全部完成"
function getPlanObj(di,si){const wk=state.plans[weekKey()];if(!wk)return null;const v=(wk[di]&&wk[di][si]);return normPlan(v);}
function getPlan(di,si){return getItems(di,si).map(x=>x.t).join('\n');}
function isDone(di,si){const items=getItems(di,si);return items.length>0 && items.every(x=>x.d);}
function setPlan(di,si,text){
  // 单条文本写入（用于拖放/放置等场景）：作为一条 item 追加或替换
  const t=text;
  if(t.trim()===''){setItems(di,si,[]);return;}
  setItems(di,si,[{t,d:false}]);
}
// 追加一条（拖放/放置用）
function appendItem(di,si,text){
  if(!text||!text.trim())return;
  const items=getItems(di,si).filter(it=>it.t.trim()!=='');
  items.push({t:text,d:false});
  setItems(di,si,items);
}
// 某一条的完成切换
function toggleItemDone(di,si,idx){
  const items=getItems(di,si);
  if(!items[idx])return;
  items[idx]={t:items[idx].t, d:!items[idx].d};
  setItems(di,si,items);
}
// 编辑某一条文字
function setItemText(di,si,idx,text){
  const items=getItems(di,si);
  while(items.length<=idx) items.push({t:'',d:false});
  items[idx]={t:text, d:items[idx]?items[idx].d:false};
  setItems(di,si,items);
}
// 在某条后面插入新空条（回车用），返回新条索引
function insertItemAfter(di,si,idx){
  const items=getItems(di,si);
  items.splice(idx+1,0,{t:'',d:false});
  setItems(di,si,items);
  return idx+1;
}
// 删除某条（退格清空时用）
function removeItem(di,si,idx){
  const items=getItems(di,si);
  items.splice(idx,1);
  setItems(di,si,items);
}
function toggleDone(di,si){
  // 整格切换（保留兼容）：全部设为与"当前是否全完成"相反
  const items=getItems(di,si);
  if(items.length===0)return;
  const allDone=items.every(x=>x.d);
  setItems(di,si, items.map(x=>({t:x.t,d:!allDone})));
}

function isMobile(){return window.innerWidth<=820;}

function render(){
  renderWeekLabel();
  const board=document.getElementById('board');
  if(state.slots.length===0){
    board.innerHTML=`<div class="empty"><h3>还没有设置时间段</h3><p>先设定一天怎么切分，就能开始安排计划了</p><button class="btn primary" onclick="openSlots()">设置时间段</button></div>`;
    return;
  }
  board.innerHTML=isMobile()?renderMobile():renderDesktop();
  bindTextareas();
}
function renderWeekLabel(){
  const sun=addDays(currentMonday,6);const y=currentMonday.getFullYear();
  document.getElementById('weekLabel').textContent=`${y}年 ${currentMonday.getMonth()+1}/${currentMonday.getDate()} – ${sun.getMonth()+1}/${sun.getDate()}`;
}

function rowHeightCss(kind){
  if(kind==='work') return 'minmax(64px,auto)'; // 至少64px，内容多则自动撑高
  if(kind==='meal') return 'minmax(46px,auto)';
  return 'minmax(34px,auto)'; // short
}

function renderDesktop(){
  // 每行高度：工作行随内容自适应，休息行也允许在有备注时长高
  let rowsCss='auto '+state.slots.map(sl=>rowHeightCss(slotKind(sl))).join(' ');
  let html=`<div class="grid desktop-view" style="grid-template-rows:${rowsCss};">`;
  html+='<div class="cell head corner">时间</div>';
  for(let d=0;d<7;d++){
    const date=addDays(currentMonday,d);const today=isToday(date)?' today':'';
    html+=`<div class="cell head${today}"><div class="dow">${DOW[d]}</div><div class="date">${date.getMonth()+1}/${date.getDate()}</div></div>`;
  }
  state.slots.forEach((sl,si)=>{
    const kind=slotKind(sl);
    const tag = kind==='meal'?'<div class="tag">用餐</div>':(kind==='short'?'<div class="tag">小憩</div>':'');
    html+=`<div class="cell timecell ${kind}" onclick="openPicker(${si})" title="点击调整时间">
      <div class="t">${sl.start}</div><div class="t2">${sl.end}</div>${tag}</div>`;
    for(let d=0;d<7;d++){
      const date=addDays(currentMonday,d);const todayCol=isToday(date)?' col-today':'';
      if(kind==='work'){
        html+=`<div class="cell plan${todayCol}" data-day="${d}" data-slot="${si}">${renderItems(d,si)}</div>`;
      }else{
        const val=escapeHtml(getPlan(d,si));
        html+=`<div class="cell plan rest ${kind}${todayCol}" data-day="${d}" data-slot="${si}"><textarea class="rest-ta" data-day="${d}" data-slot="${si}" placeholder="备注">${val}</textarea></div>`;
      }
    }
  });
  html+='</div>';
  return html;
}

/* 渲染一个工作格里的多条待办 */
function renderItems(di,si){
  const items=getItems(di,si);
  let html='<div class="items">';
  if(items.length===0){
    // 空格子：一条空输入行
    html+=itemRowHtml(di,si,0,'',false);
  }else{
    items.forEach((it,idx)=>{ html+=itemRowHtml(di,si,idx,it.t,it.d); });
  }
  html+=`<div class="add-line" onclick="addItemLine(${di},${si})">＋ 添加一条</div>`;
  html+='</div>';
  return html;
}
function itemRowHtml(di,si,idx,text,done){
  return `<div class="item-row${done?' done':''}">
    <button class="done-btn${done?' on':''}" onclick="onToggleItem(${di},${si},${idx})" title="完成">✓</button>
    <textarea class="item-ta" data-day="${di}" data-slot="${si}" data-idx="${idx}" rows="1" placeholder="${idx===0?'安排…':''}">${escapeHtml(text)}</textarea>
  </div>`;
}

let mobileMode='day'; // 'day' 单日编辑 | 'week' 整周概览

function renderMobile(){
  let html='<div class="mobile-view" style="padding:10px 10px 4px;">';
  // 日/周 模式切换
  html+=`<div class="m-modeswitch">
    <button class="${mobileMode==='day'?'on':''}" onclick="setMobileMode('day')">单日编辑</button>
    <button class="${mobileMode==='week'?'on':''}" onclick="setMobileMode('week')">整周概览</button>
  </div>`;
  if(mobileMode==='week'){
    html+=renderWeekOverview();
    html+='</div>';
    return html;
  }
  // 单日编辑
  html+='<div class="day-tabs">';
  for(let d=0;d<7;d++){
    const date=addDays(currentMonday,d);const active=d===activeDay?' active':'';const today=isToday(date)?' today':'';
    html+=`<button class="day-tab${active}${today}" onclick="selectDay(${d})">${DOW[d]}<span class="d">${date.getMonth()+1}/${date.getDate()}</span></button>`;
  }
  html+='</div></div><div>';
  state.slots.forEach((sl,si)=>{
    const kind=slotKind(sl);
    const tag=kind==='meal'?'<div class="tag" style="color:var(--meal-t)">用餐</div>':(kind==='short'?'<div class="tag" style="color:var(--rest-short-t)">小憩</div>':'');
    html+=`<div class="m-row"><div class="m-time ${kind}" onclick="openPicker(${si})"><div class="t">${sl.start}</div><div class="t2">${sl.end}</div>${tag}</div>`;
    if(kind==='work'){
      html+=`<div class="m-plan" data-day="${activeDay}" data-slot="${si}">${renderItems(activeDay,si)}</div>`;
    }else{
      const val=escapeHtml(getPlan(activeDay,si));
      html+=`<div class="m-plan rest ${kind}" data-day="${activeDay}" data-slot="${si}"><textarea class="rest-ta" data-day="${activeDay}" data-slot="${si}" placeholder="备注">${val}</textarea></div>`;
    }
    html+='</div>';
  });
  html+='</div>';
  return html;
}

// 手机整周概览（只读，可横向滚动）
function renderWeekOverview(){
  let html='<div class="week-overview"><div class="ov-grid">';
  html+='<div class="ov-cell ov-head ov-time">时间</div>';
  for(let d=0;d<7;d++){
    const date=addDays(currentMonday,d);const today=isToday(date)?' today':'';
    html+=`<div class="ov-cell ov-head${today}">${DOW[d].replace('周','')}<br>${date.getMonth()+1}/${date.getDate()}</div>`;
  }
  state.slots.forEach((sl,si)=>{
    const kind=slotKind(sl);
    html+=`<div class="ov-cell ov-time ${kind}">${sl.start}<br>${sl.end}</div>`;
    for(let d=0;d<7;d++){
      const items=getItems(d,si);
      const restCls=kind==='work'?'':(kind==='meal'?' meal':' rest-short');
      let inner='';
      if(kind==='work'){
        inner=items.map(it=>`<div${it.d?' style="text-decoration:line-through;opacity:.55"':''}>${escapeHtml(it.t)}</div>`).join('');
      }else{
        // 休息格备注仍是单条文本
        inner=escapeHtml(getPlan(d,si));
      }
      html+=`<div class="ov-cell ov-plan${restCls}">${inner}</div>`;
    }
  });
  html+='</div></div><div class="ov-hint">← 左右滑动查看整周 · 横屏更清楚 →</div>';
  return html;
}
function setMobileMode(m){mobileMode=m;render();}
function selectDay(d){activeDay=d;render();}

function bindTextareas(){
  // 休息格备注（单个）
  document.querySelectorAll('textarea.rest-ta').forEach(ta=>{
    autoGrowSimple(ta);
    ta.addEventListener('focus',e=>{
      if(pendingTask){e.preventDefault();ta.blur();onCellTapPlace(+ta.dataset.day,+ta.dataset.slot);}
    });
    ta.addEventListener('input',()=>{setPlan(+ta.dataset.day,+ta.dataset.slot,ta.value);autoGrowSimple(ta);});
  });
  // 工作格多条待办
  document.querySelectorAll('textarea.item-ta').forEach(ta=>{
    autoGrowSimple(ta);
    const di=+ta.dataset.day, si=+ta.dataset.slot, idx=+ta.dataset.idx;
    // 手机放置态：聚焦即放入
    ta.addEventListener('focus',e=>{
      if(pendingTask){e.preventDefault();ta.blur();onCellTapPlace(di,si);}
    });
    // 输入即保存该条
    ta.addEventListener('input',()=>{setItemText(di,si,+ta.dataset.idx,ta.value);autoGrowSimple(ta);});
    // 回车新增下一条；退格在空行删除本条
    ta.addEventListener('keydown',e=>{
      const curIdx=+ta.dataset.idx;
      if(e.key==='Enter'){
        e.preventDefault();
        // 先存当前值，再插入新空条并聚焦
        setItemText(di,si,curIdx,ta.value);
        const newIdx=insertItemAfter(di,si,curIdx);
        rerenderCell(di,si,newIdx);
      }else if(e.key==='Backspace' && ta.value===''){
        const items=getItems(di,si);
        if(items.length>1){
          e.preventDefault();
          removeItem(di,si,curIdx);
          rerenderCell(di,si,Math.max(0,curIdx-1));
        }
      }
    });
  });
}
// 只重渲染单个格子并把焦点放到指定条（避免整页 render 丢焦点）
function rerenderCell(di,si,focusIdx){
  const cell=document.querySelector(`[data-day="${di}"][data-slot="${si}"].plan, [data-day="${di}"][data-slot="${si}"].m-plan`);
  if(!cell){render();return;}
  cell.innerHTML=renderItems(di,si);
  // 重新绑定该格
  cell.querySelectorAll('textarea.item-ta').forEach(ta=>{
    autoGrowSimple(ta);
    const d=+ta.dataset.day,s=+ta.dataset.slot;
    ta.addEventListener('focus',e=>{if(pendingTask){e.preventDefault();ta.blur();onCellTapPlace(d,s);}});
    ta.addEventListener('input',()=>{setItemText(d,s,+ta.dataset.idx,ta.value);autoGrowSimple(ta);});
    ta.addEventListener('keydown',e=>{
      const curIdx=+ta.dataset.idx;
      if(e.key==='Enter'){e.preventDefault();setItemText(d,s,curIdx,ta.value);const ni=insertItemAfter(d,s,curIdx);rerenderCell(d,s,ni);}
      else if(e.key==='Backspace'&&ta.value===''){const items=getItems(d,s);if(items.length>1){e.preventDefault();removeItem(d,s,curIdx);rerenderCell(d,s,Math.max(0,curIdx-1));}}
    });
  });
  // 聚焦目标条
  const target=cell.querySelector(`textarea.item-ta[data-idx="${focusIdx}"]`);
  if(target){target.focus();const L=target.value.length;target.setSelectionRange(L,L);}
}
function autoGrowSimple(ta){
  ta.style.height='auto';
  ta.style.height=Math.max(ta.scrollHeight,ta.classList.contains('item-ta')?24:(isMobile()?52:40))+'px';
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ======== 时间段编辑弹窗 ======== */
let draftSlots=[];
function openSlots(){draftSlots=state.slots.map(x=>({...x}));renderTemplates();renderSlotEditor();document.getElementById('slotModal').classList.add('open');}
function closeSlots(){document.getElementById('slotModal').classList.remove('open');}
function renderTemplates(){
  document.getElementById('tplList').innerHTML=TEMPLATES.map((t,i)=>`<button class="tpl" onclick="applyTemplate(${i})"><div class="name">${t.name}</div><div class="desc">${t.desc}</div></button>`).join('');
}
function applyTemplate(i){draftSlots=TEMPLATES[i].build();renderSlotEditor();toast(`已套用「${TEMPLATES[i].name}」，记得点保存`);}
function renderSlotEditor(){
  const box=document.getElementById('slotList');
  box.innerHTML=draftSlots.map((sl,i)=>{
    const kind=slotKind(sl);
    const kindLabel=kind==='meal'?'<span class="kind">用餐</span>':(kind==='short'?'<span class="kind">小憩</span>':'');
    const mealToggle = sl.rest
      ? `<label><input type="checkbox" ${sl.meal?'checked':''} onchange="toggleMeal(${i},this.checked)">用餐</label>`
      : '';
    return `<div class="slot-item ${kind}">
      <button class="slot-time" onclick="openPickerDraft(${i},'start')">${sl.start}</button>
      <span class="dash">–</span>
      <button class="slot-time" onclick="openPickerDraft(${i},'end')">${sl.end}</button>
      ${kindLabel}
      <label><input type="checkbox" ${sl.rest?'checked':''} onchange="toggleRest(${i},this.checked)">休息</label>
      ${mealToggle}
      <button class="del" onclick="delSlot(${i})" title="删除">✕</button>
    </div>`;
  }).join('');
}
function toggleRest(i,val){draftSlots[i].rest=val;if(!val)draftSlots[i].meal=false;renderSlotEditor();}
function toggleMeal(i,val){draftSlots[i].meal=val;renderSlotEditor();}
function delSlot(i){draftSlots.splice(i,1);renderSlotEditor();}
function addSlot(){
  const last=draftSlots[draftSlots.length-1];
  const start=last?last.end:'08:00';
  const end=toHM(toMin(start)+60);
  draftSlots.push({start,end,rest:false,meal:false});
  renderSlotEditor();
}
function saveSlots(){
  draftSlots=draftSlots.filter(s=>s.start&&s.end);
  state.slots=draftSlots.map(x=>({...x}));
  save();closeSlots();render();toast('时间段已保存');
}

/* ======== 滚轮时间选择器 ======== */
/* 两种入口：
   1) openPicker(si)         —— 从主表格点时间块，直接改 state.slots[si]，带 开始/结束 切换，联动前后
   2) openPickerDraft(i,edge)—— 从弹窗内改 draftSlots，单个边
*/
let pk={mode:null, idx:0, edge:'start', h:8, m:0};

function buildWheel(el,count,fmtFn){
  let html='<div class="pad"></div>';
  for(let i=0;i<count;i++)html+=`<div class="item" data-v="${i}">${fmtFn(i)}</div>`;
  html+='<div class="pad"></div>';
  el.innerHTML=html;
}
function scrollWheelTo(el,val,smooth){
  const item=el.querySelector(`.item[data-v="${val}"]`);
  if(item)el.scrollTo({top:item.offsetTop-72,behavior:smooth?'smooth':'auto'});
}
function readWheel(el){
  const items=[...el.querySelectorAll('.item')];
  let best=0,bestDist=1e9;
  const center=el.scrollTop+72+18;
  items.forEach(it=>{
    const c=it.offsetTop+18;const dist=Math.abs(c-center);
    if(dist<bestDist){bestDist=dist;best=+it.dataset.v;}
  });
  return best;
}
function highlightWheel(el){
  const cur=readWheel(el);
  el.querySelectorAll('.item').forEach(it=>it.classList.toggle('sel',+it.dataset.v===cur));
  return cur;
}

const wheelH=document.getElementById('wheelH');
const wheelM=document.getElementById('wheelM');
buildWheel(wheelH,24,i=>String(i).padStart(2,'0'));
buildWheel(wheelM,60,i=>String(i).padStart(2,'0')); // 每分钟一格，精确

let hTimer,mTimer;
function onWheelScroll(el,timerRef){
  highlightWheel(el);
  clearTimeout(timerRef.t);
  timerRef.t=setTimeout(()=>{
    const v=readWheel(el);
    scrollWheelTo(el,v,true);
    if(el===wheelH)pk.h=v;else pk.m=v;
    updatePreview();
  },90);
}
const hRef={t:null},mRef={t:null};
wheelH.addEventListener('scroll',()=>onWheelScroll(wheelH,hRef));
wheelM.addEventListener('scroll',()=>onWheelScroll(wheelM,mRef));

function updatePreview(){
  const hm=toHM(pk.h*60+pk.m);
  const prev=document.getElementById('pickerPreview');
  if(pk.mode==='main'){
    const sl=state.slots[pk.idx];
    const other= pk.edge==='start' ? `结束 ${sl.end}` : `开始 ${sl.start}`;
    prev.innerHTML=`当前设定：<b>${hm}</b> &nbsp;·&nbsp; ${pk.edge==='start'?'开始':'结束'} &nbsp;(另一端 ${other})`;
  }else{
    prev.innerHTML=`当前设定：<b>${hm}</b>`;
  }
}

function openPickerCommon(h,m){
  pk.h=h;pk.m=m;
  document.getElementById('pickerMask').classList.add('open');
  // 等待渲染后定位
  requestAnimationFrame(()=>{
    scrollWheelTo(wheelH,h,false);scrollWheelTo(wheelM,m,false);
    highlightWheel(wheelH);highlightWheel(wheelM);updatePreview();
  });
}

// 主表格入口：带 开始/结束 切换；若是休息块，额外显示 休息/用餐 类型切换
function openPicker(si){
  pk.mode='main';pk.idx=si;pk.edge='start';
  const sl=state.slots[si];
  document.getElementById('pickerTitle').textContent='调整这个时间块';
  document.getElementById('pickerWhich').textContent=`${sl.start} – ${sl.end}`;
  document.getElementById('pickerSwitch').style.display='flex';
  setEdgeButtons('start');
  // 只有休息块才显示 休息/用餐 类型切换
  const kindBox=document.getElementById('pickerKind');
  if(sl.rest){
    kindBox.style.display='flex';
    setKindButtons(sl.meal?'meal':'short');
  }else{
    kindBox.style.display='none';
  }
  const[h,m]=sl.start.split(':').map(Number);
  openPickerCommon(h,m);
}

function openPickerDraft(i,edge){

}

}
function setKindButtons(kind){

}

}
document.querySelectorAll('#pickerSwitch button').forEach(b=>{

    commitPickerValue(false);
    pk.edge=b.dataset.edge;setEdgeButtons(pk.edge);

  };
});

function closePicker(){document.getElementById('pickerMask').classList.remove('open');}

/* 统一衔接：把 arr[idx] 的 edge 端设为 hm，然后向两侧传播，保证：
   - 相邻段首尾相接（arr[i].end === arr[i+1].start）
   - 每段 start < end（至少 MIN 分钟）
   传播方向：改 end 往后推，改 start 往前推。被挤压的段会被压缩到最小时长，
   若压不下则继续推动它的另一端，连锁传递。 */
const SLOT_MIN=5;
function applyEdge(arr, idx, edge, hm){
  arr[idx][edge]=hm;
  if(edge==='end'){
    // 保证本段自身合法
    if(toMin(arr[idx].end)<=toMin(arr[idx].start))
      arr[idx].end=toHM(toMin(arr[idx].start)+SLOT_MIN);
    propagateForward(arr, idx);
  }else{
    if(toMin(arr[idx].start)>=toMin(arr[idx].end))
      arr[idx].start=toHM(toMin(arr[idx].end)-SLOT_MIN);
    propagateBackward(arr, idx);
  }
}
// 从 idx 向后：让每个后继段 start 跟上前一段 end，若因此 start>=end 则把 end 也顺推
function propagateForward(arr, idx){
  for(let i=idx;i<arr.length-1;i++){
    const need=toMin(arr[i].end);
    if(toMin(arr[i+1].start)!==need){
      arr[i+1].start=arr[i].end;
      if(toMin(arr[i+1].end)<=toMin(arr[i+1].start))
        arr[i+1].end=toHM(toMin(arr[i+1].start)+SLOT_MIN);
    }else break; // 已衔接且合法，无需继续
  }
}
// 从 idx 向前：让每个前驱段 end 贴住后一段 start，若因此 start>=end 则把 start 也前推
function propagateBackward(arr, idx){
  for(let i=idx;i>0;i--){
    const need=toMin(arr[i].start);
    if(toMin(arr[i-1].end)!==need){
      arr[i-1].end=arr[i].start;
      if(toMin(arr[i-1].start)>=toMin(arr[i-1].end))
        arr[i-1].start=toHM(toMin(arr[i-1].end)-SLOT_MIN);
    }else break;
  }
}

// 把当前滚轮值写回。rerender=是否刷新界面
function commitPickerValue(rerender){
  const hm=toHM(pk.h*60+pk.m);
  if(pk.mode==='main'){
    applyEdge(state.slots, pk.idx, pk.edge, hm);
    const sl=state.slots[pk.idx];
    document.getElementById('pickerWhich').textContent=`${sl.start} – ${sl.end}`;
    if(rerender){save();render();}
  }else{
    applyEdge(draftSlots, pk.idx, pk.edge, hm);
    if(rerender)renderSlotEditor();
  }
}
document.getElementById('pickerDone').onclick=()=>{commitPickerValue(true);closePicker();};
document.getElementById('pickerCancel').onclick=closePicker;
document.getElementById('pickerMask').onclick=e=>{if(e.target.id==='pickerMask')closePicker();};

/* 导出/导入 */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=`周计划表备份_${fmt(new Date())}.json`;a.click();URL.revokeObjectURL(url);
  toast('已导出备份文件');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.slots||!d.plans)throw 0;if(!confirm('导入会覆盖当前所有数据，确定继续吗？'))return;state=d;save();render();toast('导入成功');}catch(err){toast('导入失败：文件格式不正确');}};
  reader.readAsText(file);
}

let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}

/* 事件 */
/* ===== 完成勾 ===== */
function onToggleItem(di,si,idx){
  toggleItemDone(di,si,idx);
  rerenderCell(di,si,idx);
}
function addItemLine(di,si){

/* ===== 主题 ===== */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
  const btn=document.getElementById('themeBtn');
  if(btn) btn.textContent = state.theme==='dark' ? '☀️' : '🌙';
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', state.theme==='dark' ? '#1e1d1a' : '#3a6b5e');
}
function toggleTheme(){
  state.theme = state.theme==='dark' ? 'light' : 'dark';
  save(); applyTheme();
}

/* ===== 拖放（清单任务 -> 计划格）：统一用 pointer 事件，电脑手机通用 ===== */
let drag=null; // {id,text,ghost,started,startX,startY}
const DRAG_THRESHOLD=6; // 移动超过6px才算拖拽

function onTaskPointerDown(e,id){
  const t=state.inbox.find(x=>x.id===id);
  if(!t)return;
  e.preventDefault();
  drag={id:t.id, text:t.text, ghost:null, started:false, startX:e.clientX, startY:e.clientY};
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragUp);
}
function onDragMove(e){
  if(!drag)return;
  const dx=e.clientX-drag.startX, dy=e.clientY-drag.startY;
  if(!drag.started){
    if(Math.abs(dx)<DRAG_THRESHOLD && Math.abs(dy)<DRAG_THRESHOLD) return;
    // 开始拖拽：创建浮层
    drag.started=true;
    const g=document.createElement('div');
    g.className='drag-ghost';
    g.textContent=drag.text;
    document.body.appendChild(g);
    drag.ghost=g;
    // 拖拽开始就收起清单，方便看到表格
    closeInbox();
  }
  // 浮层跟随
  drag.ghost.style.left=e.clientX+'px';
  drag.ghost.style.top=e.clientY+'px';
  // 高亮当前悬停的格子
  highlightCellAt(e.clientX,e.clientY);
}
function highlightCellAt(x,y){
  document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));
  const cell=cellFromPoint(x,y);
  if(cell)cell.classList.add('drop-hover');
}
function cellFromPoint(x,y){
  // 浮层会挡住 elementFromPoint，先临时禁用其指针事件
  if(drag&&drag.ghost)drag.ghost.style.pointerEvents='none';
  let el=document.elementFromPoint(x,y);
  while(el && !(el.classList&&(el.classList.contains('plan')||el.classList.contains('m-plan')))){
    el=el.parentElement;
  }
  return el;
}
function onDragUp(e){
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragUp);
  if(!drag){return;}
  if(drag.started){
    const cell=cellFromPoint(e.clientX,e.clientY);
    if(cell){
      const di=+cell.dataset.day, si=+cell.dataset.slot;
      appendItem(di,si,drag.text);
      state.inbox=state.inbox.filter(t=>t.id!==drag.id);
      save();
      toast('已加入计划');
    }
    if(drag.ghost)drag.ghost.remove();
    document.querySelectorAll('.drop-hover').forEach(el=>el.classList.remove('drop-hover'));
    render();
    // 不自动重开清单，让用户看到刚放入的内容；需要时自己再点"清单"
  }else{
    // 没拖动（点一下）：什么都不做，让用户知道要拖
  }
  drag=null;
}

/* ===== 清单收集区 ===== */
function openInbox(){
  document.getElementById('inbox').classList.add('open');
  document.getElementById('inboxMask').classList.add('open');
  renderInbox();
}
function closeInbox(){
  document.getElementById('inbox').classList.remove('open');
  document.getElementById('inboxMask').classList.remove('open');
}
function renderInbox(){
  const body=document.getElementById('inboxBody');
  if(state.categories.length===0){
    body.innerHTML='<div class="inbox-empty">还没有模块，点下方「新建模块」开始</div>';
    return;
  }
  let html='';
  state.categories.forEach((cat,ci)=>{
    const tasks=state.inbox.filter(t=>t.cat===cat);
    html+=`<div class="cat-block">
      <div class="cat-title"><span class="dot"></span>${escapeHtml(cat)}
        <span class="cat-del" onclick="delCategory(${ci})" title="删除模块">✕</span></div>`;
    tasks.forEach((t)=>{
      const pending=pendingTask&&pendingTask.id===t.id?' style="outline:2px solid var(--accent);"':'';
      html+=`<div class="task"${pending}
        onpointerdown="onTaskPointerDown(event,'${t.id}')">
        <span class="grip">⠿</span>
        <span class="txt">${escapeHtml(t.text)}</span>
        <span class="task-del" onpointerdown="event.stopPropagation();" onclick="event.stopPropagation();delTask('${t.id}')">✕</span>
      </div>`;
    });
    html+=`<div class="add-task">
      <input type="text" placeholder="添加到「${escapeHtml(cat)}」…" onkeydown="if(event.key==='Enter')addTask(${ci},this)">
      <button onclick="addTask(${ci},this.previousElementSibling)">加</button>
    </div></div>`;
  });
  body.innerHTML=html;
}
function addTask(ci,input){
  const text=input.value.trim();
  if(!text)return;
  const cat=state.categories[ci];
  state.inbox.push({id:'t'+Date.now()+Math.random().toString(36).slice(2,6),text,cat});
  save();input.value='';renderInbox();
}
function delTask(id){
  state.inbox=state.inbox.filter(t=>t.id!==id);
  save();renderInbox();
}
function addCategory(){
  const name=prompt('新模块名称（比如：健身、家务、副业）');
  if(!name||!name.trim())return;
  if(state.categories.includes(name.trim())){toast('已有同名模块');return;}
  state.categories.push(name.trim());
  save();renderInbox();
}
function delCategory(ci){
  const cat=state.categories[ci];
  const count=state.inbox.filter(t=>t.cat===cat).length;
  if(count>0 && !confirm(`模块「${cat}」下还有 ${count} 个任务，一起删除吗？`))return;
  state.inbox=state.inbox.filter(t=>t.cat!==cat);
  state.categories.splice(ci,1);
  save();renderInbox();
}

/* 手机触摸拖拽兜底：点任务进入"待放置"，再点某个计划格放入。 */
let pendingTask=null; // {id,text}
function onTaskClick(id){
  if(!isMobile())return; // 桌面用原生拖拽
  const t=state.inbox.find(x=>x.id===id);
  if(!t)return;
  if(pendingTask && pendingTask.id===id){
    pendingTask=null;hidePlaceBar();renderInbox();return;
  }
  pendingTask={id:t.id,text:t.text};
  closeInbox();
  render();
  showPlaceBar(t.text);
}
function showPlaceBar(text){
  let bar=document.getElementById('placeBar');
  if(!bar){
    bar=document.createElement('div');bar.id='placeBar';
    bar.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--accent);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 -4px 20px rgba(0,0,0,.2);';
    document.body.appendChild(bar);
  }
  bar.innerHTML=`<span style="flex:1">正在放置「${escapeHtml(text)}」，点一个计划格填入</span><button onclick="cancelPlace()" style="background:rgba(255,255,255,.25);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:13px;">取消</button>`;
  bar.style.display='flex';
}
function hidePlaceBar(){const bar=document.getElementById('placeBar');if(bar)bar.style.display='none';}
function cancelPlace(){pendingTask=null;hidePlaceBar();toast('已取消');}
// 手机放置态下点格子
function onCellTapPlace(di,si){
  if(!pendingTask)return false;
  appendItem(di,si,pendingTask.text);
  state.inbox=state.inbox.filter(t=>t.id!==pendingTask.id);
  save();pendingTask=null;hidePlaceBar();render();toast('已加入计划');
  return true;
}

window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,150);});

applyTheme();
render();
